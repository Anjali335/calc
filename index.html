<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbbf24">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SEA HOWLKS</h1>
        <p>Professional Financial Dashboard</p>
        <div class="save-status">
            <span id="saveIndicator" class="save-indicator">✓ Auto-saving enabled</span>
        </div>
    </div>

    <div class="card">

        <h2>Company Details</h2>

        <div class="row">
            <label>Company Name</label>
            <input type="text" id="company" value="SEA HOWLKS">
        </div>

        <div class="row phone-row">
            <label>Phone</label>
            <div class="phone-group">
                <select id="phoneCountry">
                    <option value="" disabled selected>Select country</option>
                    <option value="+91">India +91</option>
                    <option value="+1">USA +1</option>
                    <option value="+44">UK +44</option>
                    <option value="+61">Australia +61</option>
                    <option value="+971">UAE +971</option>
                </select>
                <input type="tel" id="phone" maxlength="10" inputmode="numeric" pattern="[0-9]*" placeholder="10 digits only" autocomplete="tel" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
            </div>
        </div>

        <div class="row">
            <label>Email</label>
            <input type="email" id="email">
        </div>

        <div class="row">
            <label>Report Generated By</label>
            <input type="text" id="generatedBy">
        </div>

    </div>

    <div class="card">

        <h2>Client Details</h2>

        <div class="row">
            <label>Client Name</label>
            <input type="text" id="client" maxlength="60" placeholder="Up to 60 characters">
        </div>

        

    </div>

    <div class="card">

        <h2>Financial Inputs</h2>

        <div class="row">
            <label>Currency</label>

            <select id="currency">
                <option value="₹">INR</option>
                <option value="$">USD</option>
                <option value="€">EUR</option>
                <option value="£">GBP</option>
            </select>
        </div>

        <div class="row">
            <label>Investment Amount</label>

            <div class="input-group">
                <span class="currency-symbol">₹</span>
                <input type="number" id="investment">
            </div>
        </div>

        <div class="row">
            <label>Maturity Period</label>
            <input type="text" id="months" value="20 Months">
        </div>

        <div class="row">
            <label>Profit Withdrawal</label>

            <div class="input-group">
                <span class="currency-symbol">₹</span>
                <input type="number" id="profitAmount">
            </div>
        </div>

        <div class="row">
            <label>Profit %</label>

            <div class="input-group">
                <span>%</span>
                <input type="number" id="profitPercent" value="60">
            </div>
        </div>

        <div class="row">
            <label>Outstanding Withdrawal</label>

            <div class="input-group">
                <span class="currency-symbol">₹</span>
                <input type="number" id="outstandingAmount">
            </div>
        </div>

        <div class="row">
            <label>Outstanding %</label>

            <div class="input-group">
                <span>%</span>
                <input type="number" id="outstandingPercent" value="60">
            </div>
        </div>

        <button onclick="calculateReport()">
            Calculate Report
        </button>

    </div>

    <div id="results" class="results-grid"></div>

    <div id="shareControls" class="share-controls hidden">

    <button type="button" onclick="shareByWhatsApp()">
        WhatsApp
    </button>

    <button type="button" onclick="copyReport()">
        Copy Report
    </button>

    <button type="button" onclick="downloadDataAsJSON()" class="btn-secondary">
        Download Data
    </button>

    <button type="button" onclick="clearFormData()" class="btn-danger">
        Clear Saved Data
    </button>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-1zv9y6uP31uNQc3bYUj7LjwuSq6cd0YpflkoL3R7vHfIY3Dgf1Htz7qPyRIsHjRVIvSfZxQDM0eN5fa8J4e+9g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('SW Registered'))
      .catch(err => console.log(err));
  });
}
</script>

</body>
</html>
